<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>手の開閉で音声スイッチ</title><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto}h1{font-size:1.25rem;margin:4px 0 10px}p{line-height:1.5}.hint{font-size:.9rem;color:#444}video{display:none}canvas{display:block;width:100%;height:auto;background:#111;border-radius:9px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:10px 0}button,select,input{font:inherit;min-height:44px;padding:8px;border:1px solid #aaa;border-radius:8px;background:white;color:#222;width:100%}button.primary{background:#1769cc;color:white;border:0;font-weight:600}button.dark{background:#555;color:white;border:0}.status{padding:10px;background:white;border:1px solid #ddd;border-radius:8px;margin:10px 0;overflow-wrap:anywhere}.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.panel{background:white;border:1px solid #ddd;border-radius:10px;padding:12px}.panel h2{font-size:1.05rem;margin:0 0 10px}.field{margin:10px 0}.field label{display:block;font-weight:600;margin-bottom:5px}input[type=checkbox]{width:20px;min-height:20px}</style></head><body><main>
<h1>手の開閉で音声スイッチ</h1><p class="hint">親指・人差し指・中指を中心に手の形を認識し、「開いた」「閉じた」の2種類だけで左右別々の言葉を読み上げます。</p><video id="video" autoplay playsinline muted></video><canvas id="canvas" width="640" height="480"></canvas>
<label for="cameraSelect" style="display:block;font-weight:600;margin-top:10px">映像入力</label><select id="cameraSelect"><option value="">カメラ一覧を取得してください</option></select><div class="controls"><button id="refreshBtn" class="dark">カメラ一覧を更新</button><button id="startBtn" class="primary">カメラ・手認識を開始</button><button id="stopBtn" class="dark" disabled>停止</button><button id="testBtn" class="dark">音声テスト</button></div><div id="status" class="status" role="status" aria-live="polite">状態：カメラを接続して開始してください。</div><div class="controls"><label style="display:flex;align-items:center;gap:8px;background:white;padding:8px;border-radius:8px"><input id="autoSpeak" type="checkbox" checked> 自動で読み上げる</label><label style="display:flex;align-items:center;gap:8px;background:white;padding:8px;border-radius:8px">安定判定<select id="stableMs" style="flex:1"><option value="500">0.5秒</option><option value="800" selected>0.8秒</option><option value="1200">1.2秒</option><option value="1600">1.6秒</option></select></label></div>
<div class="panels"><section class="panel"><h2>左手の言葉設定</h2><div class="field"><label for="leftOpen">手を開いたとき</label><input id="leftOpen" type="text" value="左手を開きました" placeholder="読み上げる言葉"></div><div class="field"><label for="leftClosed">手を閉じたとき</label><input id="leftClosed" type="text" value="左手を閉じました" placeholder="読み上げる言葉"></div></section><section class="panel"><h2>右手の言葉設定</h2><div class="field"><label for="rightOpen">手を開いたとき</label><input id="rightOpen" type="text" value="右手を開きました" placeholder="読み上げる言葉"></div><div class="field"><label for="rightClosed">手を閉じたとき</label><input id="rightClosed" type="text" value="右手を閉じました" placeholder="読み上げる言葉"></div></section></div>
<p class="hint">手を開く＝親指・人差し指・中指のうち2本以上が伸びている状態。手を閉じる＝伸びている指が1本以下の状態です。薬指・小指は判定に使いません。手の向きや個人差により、判定の調整が必要な場合があります。</p></main>
<script>(()=>{const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d'),status=$('status'),select=$('cameraSelect');let stream=null,model=null,raf=null,running=false,busy=false,lastSeen={Left:0,Right:0};const state={Left:{candidate:'',since:0,spoken:''},Right:{candidate:'',since:0,spoken:''}};function msg(s){status.textContent='状態：'+s}async function refresh(){if(!navigator.mediaDevices?.enumerateDevices){msg('カメラ機能が使えません。SafariでHTTPSのページを開いてください。');return}try{const cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),old=select.value;select.innerHTML='';if(!cams.length)select.add(new Option('カメラが見つかりません',''));cams.forEach((d,i)=>select.add(new Option(d.label||'カメラ '+(i+1),d.deviceId)));if(cams.some(d=>d.deviceId===old))select.value=old;msg('映像入力を'+cams.length+'台検出しました。使用するカメラを選んで開始してください。')}catch(e){msg('一覧取得エラー：'+e.name+' '+e.message)}}function speak(text){if(!text||!$('autoSpeak').checked||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)}function handOpen(lm){const index=lm[8].y<lm[6].y-.025,middle=lm[12].y<lm[10].y-.025;const thumbDist=Math.hypot(lm[4].x-lm[2].x,lm[4].y-lm[2].y),thumbBaseDist=Math.hypot(lm[3].x-lm[2].x,lm[3].y-lm[2].y),thumb=thumbDist>thumbBaseDist*1.35;return [thumb,index,middle].filter(Boolean).length>=2?'open':'closed'}function draw(lm){ctx.strokeStyle='#00e676';ctx.lineWidth=3;const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];links.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(lm[a].x*canvas.width,lm[a].y*canvas.height);ctx.lineTo(lm[b].x*canvas.width,lm[b].y*canvas.height);ctx.stroke()});ctx.fillStyle='#ffeb3b';[4,8,12].forEach(i=>{ctx.beginPath();ctx.arc(lm[i].x*canvas.width,lm[i].y*canvas.height,7,0,Math.PI*2);ctx.fill()})}function handle(side,shape,now){const s=state[side];if(s.candidate!==shape){s.candidate=shape;s.since=now;return}if(now-s.since<Number($('stableMs').value)||s.spoken===shape)return;s.spoken=shape;const id=side==='Left'?(shape==='open'?'leftOpen':'leftClosed'):(shape==='open'?'rightOpen':'rightClosed'),text=$(id).value.trim();if(text){speak(text);msg((side==='Left'?'左手':'右手')+'：'+(shape==='open'?'開いた':'閉じた')+' →「'+text+'」')}else msg((side==='Left'?'左手':'右手')+'：'+(shape==='open'?'開いた':'閉じた')+'（読み上げ文字は空欄です）')}function stop(show=true){running=false;if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;if(model){try{model.close()}catch(e){}model=null}$('startBtn').disabled=false;$('stopBtn').disabled=true;if(show)msg('停止しました。')}async function start(){if(!navigator.mediaDevices?.getUserMedia){msg('カメラ機能が利用できません。SafariでHTTPSのページを開いてください。');return}stop(false);msg('カメラを接続しています…');try{const constraints=select.value?{deviceId:{exact:select.value},width:{ideal:1280},height:{ideal:720}}:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}};stream=await navigator.mediaDevices.getUserMedia({video:constraints,audio:false});video.srcObject=stream;await video.play();if(typeof Hands==='undefined')throw Error('手認識ライブラリを読み込めません。インターネット接続を確認してください。');model=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});model.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.8,minTrackingConfidence:.8});model.onResults(r=>{if(!running)return;canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;ctx.clearRect(0,0,canvas.width,canvas.height);if(r.image)ctx.drawImage(r.image,0,0,canvas.width,canvas.height);const now=performance.now(),found={Left:false,Right:false};(r.multiHandLandmarks||[]).forEach((lm,i)=>{draw(lm);const raw=r.multiHandedness?.[i]?.label||'Right',side=raw==='Left'?'Right':'Left';found[side]=true;lastSeen[side]=now;const shape=handOpen(lm);ctx.fillStyle='#00e676';ctx.font='bold 22px sans-serif';ctx.fillText((side==='Left'?'左手':'右手')+'：'+(shape==='open'?'開いた':'閉じた'),12,side==='Left'?30:58);handle(side,shape,now)});['Left','Right'].forEach(s=>{if(!found[s]&&now-lastSeen[s]>350){state[s].candidate='';state[s].spoken=''}});if(!(r.multiHandLandmarks||[]).length){ctx.fillStyle='white';ctx.font='20px sans-serif';ctx.fillText('手をカメラに映してください',16,32)}});running=true;$('startBtn').disabled=true;$('stopBtn').disabled=false;msg('手認識を開始しました。手を開く・閉じる動きを試してください。');const loop=async()=>{if(!running||!model)return;if(!busy&&video.readyState>=2){busy=true;try{await model.send({image:video})}catch(e){msg('手認識エラー：'+e.message)}busy=false}if(running)raf=requestAnimationFrame(loop)};loop();await refresh()}catch(e){stop(false);let tip='';if(e.name==='NotAllowedError'||e.name==='SecurityError')tip=' Safariのカメラ許可とHTTPSを確認してください。';else if(e.name==='NotFoundError')tip='カメラが見つかりません。USB-C接続を確認してください。';else if(e.name==='NotReadableError')tip='他のアプリがカメラを使用中でないか、給電を確認してください。';msg('開始できません：'+(e.name||'')+' '+e.message+'。'+tip)}}$('refreshBtn').addEventListener('click',refresh);$('startBtn').addEventListener('click',start);$('stopBtn').addEventListener('click',()=>stop());$('testBtn').addEventListener('click',()=>speak('音声テストです。'));select.addEventListener('change',()=>{if(running)msg('カメラを変更するには停止し、再度開始してください。')});window.addEventListener('pagehide',()=>stop(false));refresh()})();</script></body></html>
